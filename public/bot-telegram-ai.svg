<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradientBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradientBot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c39920;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradientBot)" />
  
  <!-- Phone Frame -->
  <rect x="400" y="100" width="400" height="600" rx="30" fill="#0f1419" stroke="#d4af37" stroke-width="3" />
  
  <!-- Phone Screen -->
  <rect x="420" y="140" width="360" height="520" rx="20" fill="url(#chatGradient)" />
  
  <!-- Chat Header -->
  <rect x="420" y="140" width="360" height="60" rx="20" fill="#1e3c72" opacity="0.8" />
  <circle cx="460" cy="170" r="20" fill="#d4af37" opacity="0.6" />
  <rect x="490" y="155" width="120" height="15" rx="4" fill="#d4af37" opacity="0.4" />
  <rect x="490" y="175" width="80" height="10" rx="3" fill="#8c8c8c" opacity="0.4" />
  
  <!-- Chat Messages -->
  <!-- User Message 1 -->
  <rect x="440" y="220" width="180" height="50" rx="10" fill="#d4af37" opacity="0.3" />
  <rect x="450" y="235" width="100" height="8" rx="2" fill="#d4d4d4" opacity="0.6" />
  <rect x="450" y="250" width="60" height="6" rx="2" fill="#d4d4d4" opacity="0.4" />
  
  <!-- Bot Response 1 -->
  <rect x="580" y="280" width="180" height="70" rx="10" fill="#0f1419" opacity="0.6" />
  <rect x="590" y="295" width="120" height="8" rx="2" fill="#d4d4d4" opacity="0.6" />
  <rect x="590" y="310" width="140" height="6" rx="2" fill="#d4d4d4" opacity="0.4" />
  <rect x="590" y="325" width="100" height="6" rx="2" fill="#d4d4d4" opacity="0.4" />
  
  <!-- User Message 2 -->
  <rect x="440" y="360" width="160" height="40" rx="10" fill="#d4af37" opacity="0.3" />
  <rect x="450" y="375" width="80" height="8" rx="2" fill="#d4d4d4" opacity="0.6" />
  
  <!-- Bot Response 2 with Options -->
  <rect x="580" y="410" width="180" height="100" rx="10" fill="#0f1419" opacity="0.6" />
  <rect x="590" y="425" width="100" height="8" rx="2" fill="#d4d4d4" opacity="0.6" />
  <rect x="590" y="440" width="140" height="6" rx="2" fill="#d4d4d4" opacity="0.4" />
  
  <!-- Option Buttons -->
  <rect x="590" y="455" width="70" height="25" rx="5" fill="#d4af37" opacity="0.4" />
  <rect x="670" y="455" width="70" height="25" rx="5" fill="#d4af37" opacity="0.4" />
  <rect x="590" y="485" width="70" height="20" rx="5" fill="#d4af37" opacity="0.4" />
  
  <!-- User Message 3 -->
  <rect x="440" y="520" width="200" height="40" rx="10" fill="#d4af37" opacity="0.3" />
  <rect x="450" y="535" width="120" height="8" rx="2" fill="#d4d4d4" opacity="0.6" />
  
  <!-- Bot Response 3 - Confirmation -->
  <rect x="580" y="570" width="180" height="60" rx="10" fill="#0f1419" opacity="0.6" />
  <rect x="590" y="585" width="140" height="8" rx="2" fill="#4ade80" opacity="0.6" />
  <rect x="590" y="600" width="100" height="6" rx="2" fill="#4ade80" opacity="0.4" />
  
  <!-- Input Area -->
  <rect x="420" y="620" width="360" height="40" rx="10" fill="#1e3c72" opacity="0.8" />
  <rect x="440" y="632" width="280" height="16" rx="4" fill="#0f1419" opacity="0.5" />
  <circle cx="740" cy="640" r="12" fill="#d4af37" opacity="0.6" />
  
  <!-- AI Badge -->
  <circle cx="750" cy="150" r="25" fill="url(#goldGradientBot)" opacity="0.8" />
  <text x="750" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0d0d0d" text-anchor="middle">AI</text>
  
  <!-- Workflow Indicator -->
  <rect x="100" y="350" width="250" height="100" rx="10" fill="#0f1419" stroke="#d4af37" stroke-width="2" opacity="0.4" />
  <text x="225" y="380" font-family="Arial, sans-serif" font-size="14" fill="#d4af37" text-anchor="middle" opacity="0.8">Workflow n8n</text>
  <circle cx="150" cy="410" r="8" fill="#4ade80" opacity="0.6" />
  <circle cx="200" cy="410" r="8" fill="#d4af37" opacity="0.6" />
  <circle cx="250" cy="410" r="8" fill="#d4af37" opacity="0.6" />
  <circle cx="300" cy="410" r="8" fill="#8c8c8c" opacity="0.4" />
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#d4af37" text-anchor="middle" opacity="0.8">
    Agente IA para Compra de Tickets
  </text>
</svg>
